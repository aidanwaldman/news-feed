name: news-feed

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write            # needed to commit seen.json back

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run feed check
        run: python3 check_feeds.py

      - name: Commit state
        run: |
          git config user.name "wire-desk-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen state"
          git push
