name: news-feed

on:
  schedule:
    - cron: "*/5 * * * *"   # backstop schedule; cron-job.org is the real heartbeat
  workflow_dispatch: {}      # lets cron-job.org and you trigger it

permissions:
  contents: write            # needed to commit seen.json back

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run feed check
        run: python3 check_feeds.py

      - name: Commit state
        run: |
          git config user.name "wire-desk-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen state"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push collided, retrying ($i)..."
            sleep 3
          done
          echo "push failed after 5 attempts"
          exit 1
